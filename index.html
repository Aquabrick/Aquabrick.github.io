<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoaib Musse</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 2.75rem 2.25rem;
      background: linear-gradient(180deg, rgba(24, 24, 27, 0.65) 0%, rgba(12, 12, 14, 0.85) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #a1a1aa;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1.75rem;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #eab308;
      box-shadow: 0 0 10px #eab308;
      animation: pulse 2.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    h1 {
      font-size: 2.15rem;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.15;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.65rem;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #71717a;
      font-weight: 400;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.07);
      margin: 1.75rem 0 1.35rem;
    }

    .contact {
      font-size: 0.9rem;
      color: #71717a;
    }

    .contact a {
      color: #e4e4e7;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 1px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .contact a:hover {
      color: #ffffff;
      border-bottom-color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span class="dot"></span>
      <span>Website under construction</span>
    </div>
    <h1>Shoaib Musse</h1>
    <p>Welcome to my portfolio.</p>
    <div class="divider"></div>
    <p class="contact">Contact me at <a href="mailto:shoaib@shoaibmusse.com">shoaib@shoaibmusse.com</a></p>
  </main>
</body>
</html>
